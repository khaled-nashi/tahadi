<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير تحدي نافس الأسبوعي</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#F4F6F1;--card:#fff;--ink:#1E2B26;--muted:#5F6E67;--line:#DCE3DE;--green:#0F6B4F;--green-l:#E3F1EA;--sun:#F2A93B;--sun-l:#FDF1DC;--rose:#C2493A;--rose-l:#F9E3DF;--sky:#2F7FB5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Noto Kufi Arabic",Arial,sans-serif;font-size:16px}
button,input,select{font:inherit;color:inherit}
header{background:var(--green);color:#fff;padding:16px}
header .in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-family:"Noto Kufi Arabic",sans-serif;font-size:1.3rem}
header .s{opacity:.85;font-size:.9rem}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-family:"Noto Kufi Arabic",sans-serif;font-size:1.05rem;margin:0 0 12px;color:var(--green)}
.src{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=url],select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.btn{background:var(--green);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.filters label{display:block;font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .v{font-family:"Noto Kufi Arabic",sans-serif;font-size:1.7rem;font-weight:800;color:var(--green)}
.kpi .l{color:var(--muted);font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.dist{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.dist .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dist .b{width:100%;background:var(--sky);border-radius:6px 6px 0 0;min-height:2px}
.dist .n{font-size:.8rem;color:var(--muted);margin-bottom:2px}
.dist .x{font-size:.85rem;margin-top:4px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;font-size:.92rem}
th{background:var(--green-l);color:var(--green);font-size:.85rem}
td.t{text-align:right}
.bar{height:10px;background:var(--green-l);border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--green)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.8rem;font-weight:700}
.t-hard{background:var(--rose-l);color:var(--rose)}.t-mid{background:var(--sun-l);color:#8A5A0E}.t-easy{background:var(--green-l);color:var(--green)}
.note{color:var(--muted);font-size:.88rem}
.empty{text-align:center;color:var(--muted);padding:30px}
.steps{margin:0;padding-right:20px;line-height:1.9}
.hidden{display:none!important}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#ccc}}
</style>
</head>
<body>
<header><div class="in"><div><h1>تقرير وتحليل تحدي نافس الأسبوعي</h1><div class="s">المدرسة المحمدية الابتدائية • منسق نافس: خالد ناشي السعدي</div></div>
<div class="noprint"><button class="btn ghost" id="prBtn" style="background:#fff">🖨️ طباعة التقرير</button></div></div></header>
<main>
  <section class="card noprint">
    <h2>مصدر النتائج</h2>
    <div class="src"><input type="url" id="csvUrl" placeholder="رابط CSV المنشور من جدول Google Sheets"><button class="btn" id="loadBtn">تحميل</button></div>
    <div class="row"><label class="btn ghost" for="fileIn">أو اختر ملف النتائج (Excel أو CSV)</label><input type="file" id="fileIn" accept=".csv,.xlsx,.xls" class="hidden">
      <button class="btn ghost" id="demoBtn">عرض بيانات تجريبية</button><span class="note" id="srcSt"></span></div>
  </section>
  <section class="card noprint" id="filt">
    <h2>التصفية</h2>
    <div class="filters">
      <div><label>الصف والمادة</label><select id="fSubj"></select></div>
      <div><label>التحدي</label><select id="fWeek"></select></div>
      <div><label>الفصل</label><select id="fCls"></select></div>
      <div><label>النوع</label><select id="fKind"><option value="تحدي الأسبوع">تحدي الأسبوع</option><option value="">الكل (مع التدريب)</option></select></div>
      <div><label>عند تكرار المحاولة</label><select id="fDup"><option value="first">أول محاولة</option><option value="best">أفضل محاولة</option></select></div>
    </div>
  </section>
  <div id="out"><div class="card empty">حمّل النتائج لعرض التقرير.</div></div>
</main>
<script>
const D={"g3_math": {"g": "g3", "s": "math", "name": "الرياضيات", "teacher": "خالد محمد العنزي", "models": [{"n": "النموذج الأول", "f": "الأعداد ومجموعات الأعداد، والجمع والطرح", "p": null, "q": [{"q": "قيمة الرقم ٧ في العدد ‪٤٧٣٨‬ هي:", "o": ["٧", "٧٠", "٧٠٠", "٧٠٠٠"], "c": 2}, {"q": "تقريب العدد ‪٣٦٥٠‬ إلى أقرب ألف هو:", "o": ["٣٠٠٠", "٣٦٠٠", "٣٧٠٠", "٤٠٠٠"], "c": 3}, {"q": "الصورة القياسية للعدد ‪٣٠٠٠ + ٥٠٠ + ٦‬ هي:", "o": ["٣٥٦", "٣٥٠٦", "٣٥٦٠", "٣٠٥٦"], "c": 1}, {"q": "الصورة اللفظية للعدد ‪٢٠٤٥‬ هي:", "o": ["ألفان وخمسة وأربعون", "ألفان وأربعمئة وخمسة", "مئتان وخمسة وأربعون", "ألفان وخمسمئة وأربعون"], "c": 0}, {"q": "العدد المفقود في العدّ القفزي: ‪٣٢٠ ، ٣٧٠ ، ...... ، ٤٧٠‬", "o": ["٣٨٠", "٤٠٠", "٤٢٠", "٤٥٠"], "c": 2}, {"q": "أي الأعداد الآتية عدد فردي؟", "o": ["٤٥٦", "٣٨٠", "١٢٢", "٧٢٩"], "c": 3}, {"q": "العدد ‪٥٦٠٩‬ ......... العدد ‪٥٦٩٠‬", "o": ["أكبر من", "أصغر من", "يساوي", "ضعف"], "c": 1}, {"q": "ناتج ‪٧٢٤ − ٣٨٦‬ يساوي:", "o": ["٣٣٨", "٣٤٨", "٤٦٢", "٤٤٢"], "c": 0}, {"q": "في مكتبة المدرسة ٢٤٥ قصة و١٣٨ كتابًا علميًا. بتقريب كل عدد إلى أقرب مئة، فإن تقدير مجموع الكتب:", "o": ["٢٠٠", "٣٠٠", "٤٠٠", "٥٠٠"], "c": 1}, {"q": "كتاب فيه ٥٠٠ صفحة، قرأ منه سعد ١٨٥ صفحة في الأسبوع الأول، و٢٤٧ صفحة في الأسبوع الثاني. كم صفحة بقيت؟", "o": ["٤٣٢", "١٦٨", "٧٨", "٦٨"], "c": 3}]}, {"n": "النموذج الثاني", "f": "الضرب والقسمة", "p": null, "q": [{"q": "الجملة ‪٦ + ٦ + ٦ + ٦‬ تساوي:", "o": ["‪٤ × ٦‬", "‪٦ × ٦‬", "‪٤ + ٦‬", "‪٢٤ × ٤‬"], "c": 0}, {"q": "رتّب معلم ٣ صفوف من الكراسي، في كل صف ٥ كراسٍ. جملة الضرب التي تمثل ذلك:", "o": ["‪٣ + ٥ = ٨‬", "‪٣ × ٥ = ١٥‬", "‪٥ − ٣ = ٢‬", "‪٣ × ٣ = ٩‬"], "c": 1}, {"q": "الجملة التي تمثّل توزيع ١٨ قلمًا على ٣ طلاب بالتساوي:", "o": ["‪١٨ + ٣ = ٢١‬", "‪١٨ × ٣ = ٥٤‬", "‪١٨ ÷ ٣ = ٦‬", "‪١٨ − ٣ = ١٥‬"], "c": 2}, {"q": "وُزّعت ٢٤ تفاحة على ٤ أطباق بالتساوي. كم تفاحة في كل طبق؟", "o": ["٤", "٦", "٨", "٢٠"], "c": 1}, {"q": "ناتج ‪٩ × ٨‬ يساوي:", "o": ["٦٣", "٧٢", "٨١", "١٧"], "c": 1}, {"q": "ناتج ‪٥٦ ÷ ٧‬ يساوي:", "o": ["٦", "٧", "٩", "٨"], "c": 3} const AR=s=>String(s).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const L=["أ","ب","ج","د"];
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const COLS={name:"الاسم",cls:"الفصل",grade:"الصف",subj:"المادة",week:"التحدي",score:"الدرجة",time:"الوقت",ans:"الإجابات",code:"الرمز",kind:"النوع"};
let ROWS=[];
function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);r.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);r.push(row)}return r.filter(x=>x.some(v=>v!==""))}
const toEn=s=>String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
function ingest(table){
  if(!table.length){$("srcSt").textContent="الملف فارغ";return}
  const h=table[0].map(x=>String(x).trim());const idx={};
  for(const k in COLS){idx[k]=h.findIndex(x=>x===COLS[k]||x.startsWith(COLS[k]))}
  if(idx.score<0||idx.code<0){$("srcSt").textContent="لم أجد عمودي «الدرجة» و«الرمز» في الملف";return}
  ROWS=table.slice(1).map((r,i)=>{const g=k=>idx[k]>=0?String(r[idx[k]]??"").trim():"";const [key,mi]=g("code").split("|");
    return {i,name:g("name"),cls:g("cls")||"-",week:+toEn(g("week"))||0,score:+toEn(g("score"))||0,time:+toEn(g("time"))||0,ans:g("ans"),key,mi:+toEn(mi),kind:g("kind")||"تحدي الأسبوع"}}).filter(r=>D[r.key]);
  $("srcSt").textContent="تم تحميل "+AR(ROWS.length)+" نتيجة";buildFilters();render();
}
async function loadUrl(u){$("srcSt").textContent="جارٍ التحميل…";
  try{const r=await fetch(u);if(!r.ok)throw 0;ingest(parseCSV(await r.text()));store.set("tahadi_csv",u)}catch(e){$("srcSt").textContent="تعذّر تحميل الرابط. تأكد أنه منشور بصيغة CSV، أو حمّل الملف."}}
$("loadBtn").onclick=()=>{const u=$("csvUrl").value.trim();if(u)loadUrl(u)};
$("fileIn").onchange=async e=>{const f=e.target.files[0];if(!f)return;

  else $("srcSt").textContent="احفظ الملف بصيغة CSV ثم حمّله"};
$("demoBtn").onclick=()=>{const names=["سعد","فهد","خالد","عمر","يوسف","سلمان","ناصر","مشعل","ريان","تركي","عبدالله","محمد","فيصل","بدر","حمد","مالك","زياد","راكان"];
  const t=[Object.values(COLS)];

    names.forEach((n,j)=>{const cls=["أ","ب"][j%2];const p=.35+((j*37)%50)/100;let a="",sc=0;
      m.q.forEach((q,k)=>{const hard=(k*13+w)%4===0?.25:0;const ok=((j*7+k*11+w*3)%100)/100<p-hard;const ch=ok?q.c:(q.c+1+((j+k)%3))%4;a+=L[ch];if(ok)sc++});

function opts(sel,list,keep){const v=sel.value;sel.innerHTML=list.map(([val,t])=>`<option value="${val}">${t}</option>`).join("");if(keep&&[...sel.options].some(o=>o.value===v))sel.value=v}
function buildFilters(){
  const keys=[...new Set(ROWS.map(r=>r.key))];
  opts($("fSubj"),keys.map(k=>[k,"الصف "+(D[k].g==="g3"?"الثالث":"السادس")+" – "+D[k].name]),true);
  buildSub();
}
function buildSub(){const k=$("fSubj").value;const ws=[...new Set(ROWS.filter(r=>r.key===k).map(r=>r.week))].sort((a,b)=>b-a);
  opts($("fWeek"),[...ws.map(w=>[w,"التحدي "+AR(w)]),["all","كل التحديات (متابعة التقدم)"]],true);
  const cs=[...new Set(ROWS.filter(r=>r.key===k).map(r=>r.cls))].sort();opts($("fCls"),[["","كل الفصول"],...cs.map(c=>[c,"فصل "+c])],true)}
["fWeek","fCls","fKind","fDup"].forEach(id=>$(id).onchange=render);$("fSubj").onchange=()=>{buildSub();render()};
const pct=x=>AR(Math.round(x))+"٪";

  h+=`<div class="kpis"><div class="kpi"><div class="v">${AR(n)}</div><div class="l">عدد المشاركين</div></div><div class="kpi"><div class="v">${AR(avg.toFixed(1))}</div><div class="l">المتوسط من ١٠ (${pct(avg*10)})</div></div><div class="kpi"><div class="v">${pct(ge7/n*100)}</div><div class="l">حصلوا على ٧ فأكثر (${AR(ge7)})</div></div><div class="kpi"><div class="v">${AR(Math.max(...rs.map(r=>r.score)))}</div><div class="l">أعلى درجة</div></div></div><div style="height:14px"></div>`;

    let w=-1,wv=0;cnt.forEach((c,j)=>{if(j!==q.c&&c>wv){wv=c;w=j}});return {q,k,ok,cnt,w,wv,ansd}});

  const sorted=[...rs].sort((a,b)=>b.score-a.score||a.time-b.time);
  h+=`<div class="grid2"><div class="card"><h2>🏆 المتصدرون</h2><table><tr><th>#</th><th>الطالب</th><th>الفصل</th><th>الدرجة</th><th>الوقت</th></tr>${sorted.slice(0,10).map((r,i)=>`<tr><td>${i<3?["🥇","🥈","🥉"][i]:AR(i+1)}</td><td class="t">${esc(r.name)}</td><td>${esc(r.cls)}</td><td><b>${AR(r.score)}</b></td><td>${mmss(r.time)}</td></tr>`).join("")}</table></div>`;
  h+=`<div class="card"><h2>طلاب يحتاجون دعمًا (٤ فأقل)</h2>${low.length?`<table><tr><th>الطالب</th><th>الفصل</th><th>الدرجة</th><th>أخطأ في</th></tr>${low.sort((a,b)=>a.score-b.score).map(r=>`<tr><td class="t">${esc(r.name)}</td><td>${esc(r.cls)}</td><td><b>${AR(r.score)}</b></td><td>${m.q.map((q,k)=>r.ans[k]===L[q.c]?"":AR(k+1)).filter(Boolean).join("، ")}</td></tr>`).join("")}</table>`:'<p class="note">لا يوجد طلاب بدرجة ٤ فأقل.</p>'}</div></div>`;
  h+=`<div class="card"><h2>كشف النتائج الكامل</h2><table><tr><th>م</th><th>الطالب</th><th>الفصل</th><th>الدرجة</th><th>الوقت</th>${m.q.map((_,k)=>`<th>${AR(k+1)}</th>`).join("")}</tr>${sorted.map((r,i)=>`<tr><td>${AR(i+1)}</td><td class="t">${esc(r.name)}</td><td>${esc(r.cls)}</td><td><b>${AR(r.score)}</b></td><td>${mmss(r.time)}</td>${m.q.map((q,k)=>`<td style="color:${r.ans[k]===L[q.c]?"var(--green)":"var(--rose)"}">${r.ans[k]===L[q.c]?"✓":"✗"}</td>`).join("")}</tr>`).join("")}</table></div>`;
  out.innerHTML=h;
}
function renderTrend(rs,d){
  const ws=[...new Set(rs.map(r=>r.week))].sort((a,b)=>a-b);
  const st={};rs.forEach(r=>{const id=r.name+"|"+r.cls;st[id]=st[id]||{name:r.name,cls:r.cls,w:{}};const p=st[id].w[r.week];if(p===undefined||r.score>p)st[id].w[r.week]=r.score});
  let h=`<div class="card"><h2>متابعة التقدم – الصف ${d.g==="g3"?"الثالث":"السادس"} – ${d.name}</h2><table><tr><th>التحدي</th><th>المشاركون</th><th>المتوسط</th><th></th></tr>${ws.map(w=>{const a=Object.values(st).map(s=>s.w[w]).filter(x=>x!==undefined);const av=a.reduce((x,y)=>x+y,0)/a.length;return `<tr><td>التحدي ${AR(w)}</td><td>${AR(a.length)}</td><td>${AR(av.toFixed(1))}</td><td><div class="bar"><i style="width:${av*10}%"></i></div></td></tr>`}).join("")}</table></div>`;
  h+=`<div class="card"><h2>درجات كل طالب عبر التحديات</h2><table><tr><th>الطالب</th><th>الفصل</th>${ws.map(w=>`<th>ت${AR(w)}</th>`).join("")}<th>عدد المشاركات</th></tr>${Object.values(st).sort((a,b)=>a.name.localeCompare(b.name,"ar")).map(s=>`<tr><td class="t">${esc(s.name)}</td><td>${esc(s.cls)}</td>${ws.map(w=>`<td>${s.w[w]!==undefined?AR(s.w[w]):"—"}</td>`).join("")}<td>${AR(Object.keys(s.w).length)}</td></tr>`).join("")}</table></div>`;
  $("out").innerHTML=h;
}
const mmss=s=>AR(Math.floor(s/60)+":"+String(s%60).padStart(2,"0"));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("prBtn").onclick=()=>{try{window.print()}catch(e){}};
const saved=store.get("tahadi_csv");if(saved){$("csvUrl").value=saved;loadUrl(saved)}
</script>
